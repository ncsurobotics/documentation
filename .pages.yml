media:
  input: public
  output: /

components:
  sidebar:
    type: object
    label: Sidebar
    description: Control how the page appears in autogenerated sidebar groups.
    fields:
      - name: label
        label: Label
        type: string
        description: Sidebar label for this page; defaults to the page title.
      - name: order
        label: Order
        type: number
        description: Position in the autogenerated sidebar; lower numbers appear first.
      - name: hidden
        label: Hidden
        type: boolean
        description: Prevent this page from appearing in an autogenerated sidebar group.
      - name: badge
        label: Badge
        type: code
        description: Add a sidebar badge as a string or BadgeConfig object.
        options: { format: yaml }
      - name: attrs
        label: Attributes
        type: object
        description: HTML attributes to add to the page link in the sidebar.
        fields:
          - { name: class, label: Class, type: string }
          - { name: id, label: ID, type: string }
          - { name: target, label: Target, type: string }
          - { name: rel, label: Relationship, type: string }
          - { name: download, label: Download, type: string }

  hero-image:
    type: object
    label: Image
    description: Image or raw HTML displayed in the hero image slot.
    fields:
      - name: file
        label: Image file
        type: file
        description: Relative path to one image used in every theme.
      - name: dark
        label: Dark mode image
        type: file
        description: Relative path to the image used in dark mode.
      - name: light
        label: Light mode image
        type: file
        description: Relative path to the image used in light mode.
      - name: alt
        label: Alt text
        type: string
        description: Accessible alternative text for the hero image.
      - name: html
        label: HTML or inline SVG
        type: code
        description: Raw HTML or inline SVG used in the hero image slot.
        options: { format: html }

  hero:
    type: object
    label: Hero
    description: Add a hero component to the top of the page, usually with the splash template.
    fields:
      - name: title
        label: Title
        type: string
        description: Main title displayed in the hero.
      - name: tagline
        label: Tagline
        type: text
        description: Supporting text displayed below the hero title.
      - name: image
        component: hero-image
      - name: actions
        label: Actions
        type: object
        list: true
        fields:
          - name: text
            label: Text
            type: string
            required: true
            description: Visible label for the action.
          - name: link
            label: Link
            type: string
            required: true
            description: Destination URL for the hero action.
          - name: variant
            label: Variant
            type: select
            description: Visual style of the action button.
            options:
              values: [primary, secondary, minimal]
          - name: icon
            label: Icon
            type: string
            description: Starlight icon name displayed with the action.
          - name: attrs
            label: Attributes
            type: object
            description: HTML attributes added to the action link.
            fields:
              - { name: class, label: Class, type: string }
              - { name: id, label: ID, type: string }
              - { name: target, label: Target, type: string }
              - { name: rel, label: Relationship, type: string }
              - { name: download, label: Download, type: string }

  banner:
    type: object
    label: Banner
    description: Display an announcement banner at the top of the page.
    fields:
      - name: content
        label: Content
        type: rich-text
        description: Banner content; HTML may be used for links and other markup.

content:
  - name: homepage
    label: Homepage
    type: file
    path: src/content/docs/index.mdx
    format: yaml-frontmatter
    fields: &page-fields
      - name: title
        label: Title
        type: string
        required: true
        description: Page title shown at the top of the page, in browser tabs, and in metadata.
      - name: description
        label: Description
        type: text
        description: Page description used in metadata, search engines, and social previews.
      - name: slug
        label: Slug
        type: string
        description: Optional custom URL slug for this page.
      - name: editUrl
        label: Edit URL
        type: code
        description: Override the edit-page link, disable it with false, or provide another URL.
        options: { format: yaml }
      - name: head
        label: Head tags
        type: object
        list: true
        description: Additional HTML tags to add to the page head.
        fields:
          - name: tag
            label: Tag
            type: string
            required: true
            description: HTML tag name to add to the page head.
          - name: content
            label: Content
            type: text
            description: Text content for the head tag.
          - name: attrs
            label: Attributes
            type: object
            description: Attributes for the generated head tag.
            fields:
              - { name: charset, label: Charset, type: string }
              - { name: name, label: Name, type: string }
              - { name: content, label: Content, type: string }
              - { name: property, label: Property, type: string }
              - { name: rel, label: Relationship, type: string }
              - { name: href, label: Href, type: string }
      - name: tableOfContents
        label: Table of contents
        type: code
        description: Set false to hide the table of contents, or configure its heading levels.
        options: { format: yaml }
      - name: template
        label: Template
        type: select
        description: Choose the standard documentation layout or the wider splash layout.
        options:
          values: [doc, splash]
      - name: hero
        component: hero
      - name: banner
        component: banner
      - name: lastUpdated
        label: Last updated
        type: code
        description: Override the Git history date, or set false to hide the last-updated display.
        options: { format: yaml }
      - name: prev
        label: Previous page
        type: code
        description: Override or hide the previous-page pagination link.
        options: { format: yaml }
      - name: next
        label: Next page
        type: code
        description: Override or hide the next-page pagination link.
        options: { format: yaml }
      - name: pagefind
        label: Include in search
        type: boolean
        description: Include this page in the Pagefind search index.
      - name: draft
        label: Draft
        type: boolean
        description: Exclude this page from production builds while keeping it visible during development.
      - name: sidebar
        component: sidebar
      - name: body
        label: Body
        type: code
        description: MDX page content.
        options: { format: mdx }

  - name: software
    label: Software
    type: collection
    path: src/content/docs/software
    filename: "{primary}.mdx"
    format: yaml-frontmatter
    subfolders: true
    fields: *page-fields
    view:
      layout: tree
      node:
        filename: index.mdx
        hideDirs: nodes
      fields: [title, sidebar.order]
      primary: title

  - name: mechanical
    label: Mechanical
    type: collection
    path: src/content/docs/mechanical
    filename: "{primary}.mdx"
    format: yaml-frontmatter
    subfolders: true
    fields: *page-fields
    view:
      layout: tree
      node:
        filename: index.mdx
        hideDirs: nodes
      fields: [title, sidebar.order]
      primary: title

  - name: electrical
    label: Electrical
    type: collection
    path: src/content/docs/electrical
    filename: "{primary}.mdx"
    format: yaml-frontmatter
    subfolders: true
    fields: *page-fields
    view:
      layout: tree
      node:
        filename: index.mdx
        hideDirs: nodes
      fields: [title, sidebar.order]
      primary: title
