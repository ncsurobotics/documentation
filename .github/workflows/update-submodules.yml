name: Update submodules

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write
  actions: write

concurrency:
  group: update-submodules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          submodules: recursive
      - name: Update submodules
        run: git submodule update --init --remote --recursive
      - name: Commit updated submodule revisions
        run: |
          # Git supplies these variables in each submodule's shell.
          # shellcheck disable=SC2016
          git submodule foreach --quiet 'git -C "$toplevel" add -- "$sm_path"'
          if git diff --cached --quiet; then
            echo "Submodule revisions are already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs: update submodule revisions"
          git push origin HEAD:main
      - name: Trigger documentation build
        env:
          GH_TOKEN: ${{ github.token }}
        # Pushes using GITHUB_TOKEN do not trigger push workflows.
        run: gh workflow run pages.yml --ref main
