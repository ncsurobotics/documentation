name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install serial library dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-shared-${{ hashFiles('external/software/**/Cargo.lock') }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build documentation site
        run: bun run build
      - name: Build Rust documentation from submodules
        run: |
          target_dir="$GITHUB_WORKSPACE/target"
          for project in external/software/*; do
            if [[ ! -f "$project/Cargo.toml" ]]; then
              echo "Skipping $project: no Cargo.toml."
              continue
            fi
            (
              cd "$project"
              cargo doc --workspace --no-deps --locked --target-dir "$target_dir"
            )
          done
          mkdir -p "_site/external/software/rust"
          if [[ -d "$target_dir/doc" ]]; then
            rsync -a "$target_dir/doc/" "_site/external/software/rust/"
          fi
      - name: Configure site
        run: |
          printf '%s\n' docs.aquapackrobotics.org > _site/CNAME
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
