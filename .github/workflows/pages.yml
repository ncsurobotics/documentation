name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: '0.5.4'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install serial library dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-shared-${{ hashFiles('software/external/**/Cargo.lock') }}
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin" mdbook
      - name: Build books
        run: |
          for team in software electrical mechanical; do
            "$HOME/.local/bin/mdbook" build "$team" --dest-dir "$GITHUB_WORKSPACE/_site/$team"
          done
      - name: Build Rust documentation from submodules
        run: |
          target_dir="$GITHUB_WORKSPACE/target"
          for project in software/external/*; do
            if [[ ! -f "$project/Cargo.toml" ]]; then
              echo "Skipping $project: no Cargo.toml."
              continue
            fi
            (
              cd "$project"
              cargo doc --workspace --no-deps --locked --target-dir "$target_dir"
            )
          done
          mkdir -p "_site/software/external"
          if [[ -d "$target_dir/doc" ]]; then
            rsync -a "$target_dir/doc/" "_site/software/external/"
          fi
      - name: Build Rust documentation landing page
        run: |
          doc_dir="_site/software/external"
          {
            printf '%s\n' '<!doctype html>' '<html lang="en">' '<head>' \
              '<meta charset="utf-8">' '<meta name="viewport" content="width=device-width, initial-scale=1">' \
              '<title>AquaPack Rust documentation</title>' '</head>' '<body>' \
              '<h1>AquaPack Rust documentation</h1>' '<ul>'
            for index in "$doc_dir"/*/index.html; do
              [[ -f "$index" ]] || continue
              crate="${index%/index.html}"
              crate="${crate##*/}"
              printf '<li><a href="%s/">%s</a></li>\n' "$crate" "$crate"
            done
            printf '%s\n' '</ul>' '</body>' '</html>'
          } > "$doc_dir/index.html"
      - name: Configure site
        run: |
          printf '%s\n' docs.aquapackrobotics.org > _site/CNAME
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
