name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: '0.5.4'
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin" mdbook
      - name: Build books
        run: |
          for team in software electrical mechanical; do
            "$HOME/.local/bin/mdbook" build "$team" --dest-dir "$GITHUB_WORKSPACE/_site/$team"
          done
      - name: Collect published Rust documentation
        run: |
          for project in SW9S:sw9s AUVControlBoard:auv-control-board; do
            repo="${project%%:*}"
            name="${project#*:}"
            # Each source repository publishes target/doc to its rustdoc branch.
            if git ls-remote --exit-code --heads "https://github.com/ncsurobotics/$repo.git" rustdoc; then
              git clone --depth 1 --single-branch --branch rustdoc "https://github.com/ncsurobotics/$repo.git" "$RUNNER_TEMP/$name"
              mkdir -p "_site/software/crates/$name"
              rsync -a --exclude='.git' "$RUNNER_TEMP/$name/" "_site/software/crates/$name/"
            else
              status=$?
              if [[ "$status" != 2 ]]; then exit "$status"; fi
              echo "::warning::$repo has no rustdoc branch yet; skipping its documentation."
            fi
          done
          printf '%s\n' docs.aquapackrobotics.org > _site/CNAME
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
